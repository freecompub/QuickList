name: QuickList
options:
  bundleIdPrefix: app.quicklist
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  QuickListCore:
    path: Packages/QuickListCore
  QuickListAnalytics:
    path: Packages/QuickListAnalytics
  QuickListDesignSystem:
    path: Packages/QuickListDesignSystem
  QuickListAdd:
    path: Packages/QuickListAdd
  QuickListLists:
    path: Packages/QuickListLists
  QuickListAI:
    path: Packages/QuickListAI
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.5.4

targets:
  QuickList:
    type: application
    platform: iOS
    sources:
      - path: App/QuickList
    resources:
      - path: App/QuickList/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quicklist.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: QuickList
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: QuickListCore
      - package: QuickListAnalytics
      - package: QuickListDesignSystem
      - package: QuickListAdd
      - package: QuickListLists
      - package: QuickListAI
      - package: swift-log
        product: Logging
  QuickListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/QuickListTests
    dependencies:
      - target: QuickList
      - package: QuickListCore
      - package: QuickListAnalytics
      - package: QuickListDesignSystem
      - package: QuickListAdd
      - package: QuickListLists
      - package: QuickListAI
      - package: swift-log
        product: Logging
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuickList.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/QuickList"
